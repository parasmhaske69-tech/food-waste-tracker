<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Waste Reduction & Expiry Tracker</title>
    
    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Barcode/QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div class="container">
        <h1>🥦 Food Expiry Tracker</h1>
        <p>Apne groceries add karein aur waste hone se bachayein!</p>
        
        <!-- Scanner Section -->
        <button id="scanBtn" type="button" class="scan-button">📷 Scan Barcode / QR</button>
        <div id="reader" style="width: 100%; display: none; margin-bottom: 15px;"></div>

        <!-- Data Entry Form -->
        <form id="foodForm">
            <input type="text" id="itemName" placeholder="Item Name (e.g. Milk)" required>
            <input type="date" id="expiryDate" required>
            <button type="submit">Add Item</button>
        </form>

        <h2>🛒 Your Pantry</h2>
        <!-- Table -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Expiry Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="foodList">
                    <!-- Data will be generated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- JS Link -->
    <script src="script.js"></script>
</body>
</html>
